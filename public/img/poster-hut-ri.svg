<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="bgHut" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E11D48"/>
      <stop offset="1" stop-color="#BE123C"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="url(#bgHut)"/>
  <circle cx="200" cy="180" r="110" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="340" cy="60" r="50" fill="#F1B435" fill-opacity="0.2"/>
  
  <!-- Bendera Merah Putih Mini -->
  <rect x="50" y="35" width="48" height="15" fill="#FFFFFF"/>
  <rect x="50" y="20" width="48" height="15" fill="#9F1239"/>
  <rect x="47" y="18" width="4" height="60" rx="2" fill="#F8FAFC"/>

  <!-- Teks Poster HUT RI -->
  <text x="200" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" letter-spacing="1">SEMARAK HUT RI</text>
  <text x="200" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14" fill="#FDE047">Pesta Rakyat & Lomba Desa</text>
  
  <!-- Ilustrasi Warga Bahagia -->
  <g transform="translate(130, 125)">
    <!-- Karakter 1 -->
    <circle cx="30" cy="22" r="14" fill="#FFE4E6"/>
    <path d="M12 60 C12 40, 48 40, 48 60 Z" fill="#FFFFFF"/>
    <!-- Karakter 2 (Tengah) -->
    <circle cx="70" cy="16" r="16" fill="#FEE2E2"/>
    <path d="M48 60 C48 36, 92 36, 92 60 Z" fill="#F1B435"/>
    <circle cx="70" cy="22" r="4" fill="#991B1B"/>
    <!-- Karakter 3 -->
    <circle cx="110" cy="22" r="14" fill="#FFE4E6"/>
    <path d="M92 60 C92 40, 128 40, 128 60 Z" fill="#FFFFFF"/>
  </g>
  <rect x="140" y="195" width="120" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.25"/>
  <text x="200" y="211" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">17 AGUSTUS 2026</text>
</svg>
